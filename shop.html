<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <script src="https://cdn.tailwindcss.com"></script>
</head>
<bodyclass="bg-gray-100 min-h-screen">
  

  <!-- Navbar -->
  <nav class="bg-black text-white px-8 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Hunter Store</h1>

    <div class="space-x-6">
      <a href="#" class="hover:text-yellow-400"></a>
      <a href="#" class="hover:text-yellow-400"></a>
      <a href="#" class="hover:text-yellow-400"></a>
    </div>
  </nav>

  <!-- Title -->
  <section class="text-center py-10">
    <h2 class="text-4xl font-bold text-gray-800">Our Products</h2>
    <p class="text-gray-500 mt-2">Best products for you</p>
  </section>

  <!-- Product Grid -->
  <div class="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-8 pb-10">

    <!-- Product 1 -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden hover:scale-105 transition duration-300">
      <img
        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
        alt="Shoes"
        class="w-full h-72 object-cover"
      >

      <div class="p-5">
        <h3 class="text-2xl font-bold">Nike Shoes</h3>
        <p class="text-gray-500 mt-2">
          Comfortable and stylish shoes for everyday use.
        </p>

        <div class="flex justify-between items-center mt-5">
          <span class="text-2xl font-bold text-red-500">$120</span>

          <a href="#"
            class="bg-black text-white px-5 py-2 rounded-lg hover:bg-gray-800 transition">
            Buy Now
          </a>
        </div>
      </div>
    </div>

    <!-- Product 2 -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden hover:scale-105 transition duration-300">
      <img
        src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
        alt="Watch"
        class="w-full h-72 object-cover"
      >

      <div class="p-5">
        <h3 class="text-2xl font-bold">Luxury Watch</h3>
        <p class="text-gray-500 mt-2">
          Premium quality watch with modern design.
        </p>

        <div class="flex justify-between items-center mt-5">
          <span class="text-2xl font-bold text-red-500">$250</span>

          <a href="#"
            class="bg-black text-white px-5 py-2 rounded-lg hover:bg-gray-800 transition">
            Buy Now
          </a>
        </div>
      </div>
    </div>

  </div>

    <h1 id="welcome"></h1>
<div class="flex justify-center">
  <button
    onclick="logout()"
    class="bg-red-500 text-white px-5 py-2 rounded-lg"
  >
    Logout
  </button>
</div>

<script>
  function logout() {
    localStorage.removeItem("loggedInUser");
    window.location.href = "index.html";
  }
</script>
<script>
  const user = JSON.parse(localStorage.getItem("loggedInUser"));

  if (user) {
    document.getElementById("username").innerText =
      user.username;
  } else {
    window.location.href = "index.html";
  }
</script>
</body>
</html>
