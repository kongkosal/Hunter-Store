<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Online Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    header, footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px;
    }
    .container {
      width: 80%;
      margin: 100px auto 80px auto;
    }
    .product {
      display: inline-block;
      width: 23%;
      margin: 1%;
      padding: 15px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .product h3 {
      font-size: 18px;
      margin: 10px 0;
    }
    .product p {
      font-size: 16px;
      color: #333;
    }
    .product button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    .product button:hover {
      background-color: #218838;
    }
    .cart {
      background-color: #333;
      color: white;
      padding: 15px;
      text-align: center;
      position: fixed;
      top: 0;
      right: 0;
      width: 250px;
      height: 100vh;
      overflow-y: auto;
    }
    .cart h2 {
      margin-top: 0;
    }
    .cart ul {
      list-style-type: none;
      padding: 0;
    }
    .cart ul li {
      margin: 10px 0;
      font-size: 16px;
    }
    .cart .total {
      margin-top: 20px;
      font-weight: bold;
    }
    .cart button {
      background-color: #ffc107;
      color: black;
      border: none;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
    .cart button:hover {
      background-color: #e0a800;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to Hunter Store</h1>
  </header>

  <div class="container">
    <div class="product">
      <img src="480820616_122223394580077950_2564059353185534485_n.jpg" alt="Product 1">
      <h3>Mystree</h3>
      <p>$7.00</p>
      <button onclick="addToCart('Mystree', 7.00)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="Product 2">
      <h3>Product 2</h3>
      <p>$29.99</p>
      <button onclick="addToCart('Product 2', 29.99)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="Product 3">
      <h3>Product 3</h3>
      <p>$39.99</p>
      <button onclick="addToCart('Product 3', 39.99)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="Product 4">
      <h3>Product 4</h3>
      <p>$49.99</p>
      <button onclick="addToCart('Product 4', 49.99)">Add to Cart</button>
    </div>
  </div>

  <div class="cart" id="cart">
    <h2>Your Cart</h2>
    <ul id="cartItems"></ul>
    <p class="total" id="totalPrice">Total: $0.00</p>
    <button onclick="checkout()">Checkout</button>
  </div>


  </footer>

  <script>
    let cart = [];
    let totalPrice = 0;

    function addToCart(productName, productPrice) {
      cart.push({ name: productName, price: productPrice });
      totalPrice += productPrice;
      updateCart();
    }

    function removeFromCart(index) {
      totalPrice -= cart[index].price;
      cart.splice(index, 1);
      updateCart();
    }

    function updateCart() {
      const cartItems = document.getElementById('cartItems');
      const total = document.getElementById('totalPrice');
      cartItems.innerHTML = '';

      cart.forEach((item, index) => {
        const listItem = document.createElement('li');
        listItem.textContent = `${item.name} - $${item.price.toFixed(2)}`;

        const removeBtn = document.createElement('button');
        removeBtn.textContent = "Remove";
        removeBtn.style.marginLeft = "10px";
        removeBtn.style.padding = "5px";
        removeBtn.style.backgroundColor = "#dc3545";
        removeBtn.style.color = "#fff";
        removeBtn.style.border = "none";
        removeBtn.style.cursor = "pointer";
        removeBtn.onclick = () => removeFromCart(index);

        listItem.appendChild(removeBtn);
        cartItems.appendChild(listItem);
      });

      total.textContent = `Total: $${totalPrice.toFixed(2)}`;
    }

    function checkout() {
      if (cart.length === 0) {
        alert('Your cart is empty!');
        return;
      }
      alert(`Checkout - Total Price: $${totalPrice.toFixed(2)}`);
      cart = [];
      totalPrice = 0;
      updateCart();
    }
  </script>
</body>
</html>
